# Runs the same local CI script on a GitHub-hosted macOS runner (ADR-0002).
# Manual dispatch only: macOS minutes are billed on this private repository, and the
# local Scripts/ci.sh run is the primary gate during Stage 0.
name: CI

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Space-separated drop-in filters for Scripts/ci.sh (empty runs everything)"
        required: false
        default: "contracts design"

permissions:
  contents: read

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      SYLVIA_FIXTURE_CACHE: ${{ github.workspace }}/.fixture-cache
      SYLVIA_TOOLS_VENV: ${{ github.workspace }}/.venv-tools
    steps:
      # lfs: true sets up Git LFS in the checkout's own configuration and downloads the LFS files: the snapshot
      # references and evidence images (ADR-0002). Without it they would be pointer files, and Scripts/ci.sh stops at
      # its first drop-in, 00-git-lfs. Each run downloads the current LFS objects (719 objects, 65.1 MB, when LFS was
      # adopted), which counts toward the repository owner's Git LFS bandwidth on GitHub (ADR-0002, "Push-time cost").
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0; pinned per ADR-0014)
        with:
          lfs: true

      - name: Select pinned Xcode (ADR-0001)
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_27.0.app /Applications/Xcode.app; do
            if [[ -d "$candidate" ]] && DEVELOPER_DIR="$candidate/Contents/Developer" xcodebuild -version | grep -q "27A266a"; then
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::Xcode 27.0 (27A266a) is not installed on this runner image; update the runner or ADR-0001."
          ls -d /Applications/Xcode* || true
          exit 1

      - name: Install XcodeGen 2.46.0 (ADR-0002)
        run: |
          set -euo pipefail
          brew install xcodegen
          version="$(xcodegen --version)"
          if [[ "$version" != "Version: 2.46.0" ]]; then
            echo "::error::XcodeGen reports '$version'; ADR-0002 pins 2.46.0. Install that version or update ADR-0002 and ADR-0014."
            exit 1
          fi

      - name: Tools and fixtures
        run: |
          Scripts/tools/bootstrap.sh
          Scripts/fixtures/fetch.sh

      - name: Run CI
        run: Scripts/ci.sh ${{ inputs.steps }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2; pinned per ADR-0014)
        with:
          name: ci-logs
          path: .build/ci-logs/
